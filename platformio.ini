[platformio]
default_envs = super_mini_esp32_s3_hw-747
src_dir = main

[env]
platform = espressif32@6.13.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_port = COM8
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^6.21.0
    https://github.com/me-no-dev/AsyncTCP.git
lib_extra_dirs =
    components
extra_scripts = pre:tools/pio_embed_assets.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMARTCOOLING_HW747=1
    -DSMARTCOOLING_WIFI_DIAGNOSTIC_ONLY=1
    -DSMARTCOOLING_WIFI_NETWORK_ONLY=0
    -DSMARTCOOLING_WIFI_AP_CHANNEL=1
    -DSMARTCOOLING_WIFI_ENABLE_MDNS=1
    -DSMARTCOOLING_WIFI_RF_PREFLIGHT_SCAN=0
    -DSMARTCOOLING_WIFI_FORCE_OPEN_AP=1
    -DSMARTCOOLING_DEV_ENDPOINTS=0
    -Icomponents/smartcooling/include
    -Wall
    -Wextra
    -Werror=return-type

[env:super_mini_esp32_s3_hw-747]
build_type = release
build_unflags =
    -O0
    -Og
    -g
    -ggdb
build_flags =
    ${env.build_flags}
    -DSMARTCOOLING_RELEASE=1
    -Os
    -g0
